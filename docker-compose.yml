services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn"]
      interval: 5s
      timeout: 3s
      retries: 10
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vpn:${POSTGRES_PASSWORD:-vpn}@postgres:5432/vpn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 15s
      timeout: 7s
      start_period: 25s
      retries: 3
    init: true
    stop_grace_period: 35s
    restart: "on-failure:3"
volumes:
  postgres_data:
