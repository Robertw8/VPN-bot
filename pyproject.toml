[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vless-vpn-bot"
version = "0.1.0"
description = "Telegram VPN service with transactional billing"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.22,<4", "SQLAlchemy[asyncio]>=2.0.43,<3", "alembic>=1.16,<2",
  "asyncpg>=0.30,<1", "pydantic-settings>=2.10,<3", "httpx>=0.28,<1",
  "structlog>=25,<26", "qrcode[pil]>=8.2,<9", "cryptography>=45,<47"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-qrcode>=8", "aiosqlite>=0.21,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not cryptobot_live'"
markers = ["cryptobot_live: explicit Crypto Pay TESTNET network checks"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
